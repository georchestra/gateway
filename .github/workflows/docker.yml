name: "Build and publish docker image"
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - '[1-9]+.[0-9]+.x'
    tags:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: "Checking out"
      uses: actions/checkout@v4
      with:
        submodules: 'true'

    - name: "Setting up Java"
      uses: actions/setup-java@v4
      with:
        distribution: 'adopt'
        java-version: '21'
        cache: 'maven'
        server-id: geOrchestra-artifactory
        server-username: ARTIFACTORY_USERNAME_REF
        server-password: ARTIFACTORY_TOKEN_REF

    - name: "Build gateway"
      run: make install test

    - name: Getting image tag
      id: version
      run: echo "VERSION=$(echo $GITHUB_REF | cut -d / -f 3)" >> $GITHUB_OUTPUT

    - name: "Build docker image"
      if: github.repository == 'georchestra/gateway'
      run: |
        make docker
        make docker-debug

    - name: "Log in to docker.io"
      if: github.repository == 'georchestra/gateway'
      uses: docker/login-action@v3
      with:
        username: '${{ secrets.DOCKER_HUB_USERNAME }}'
        password: '${{ secrets.DOCKER_HUB_PASSWORD }}'

    - name: "Push latest to docker.io"
      if: github.ref == 'refs/heads/main' && github.repository == 'georchestra/gateway'
      run: |
        docker push georchestra/gateway:latest
        docker push georchestra/gateway:latest-debug

    - name: "Pushing release branch to docker.io"
      if: (endsWith(github.ref, '.x') || github.ref_type == 'tag') && github.repository == 'georchestra/gateway' && github.actor != 'dependabot[bot]' && github.event_name != 'pull_request'
      run: |
        docker tag georchestra/gateway:latest georchestra/gateway:${{ steps.version.outputs.VERSION }}
        docker tag georchestra/gateway:latest-debug georchestra/gateway:${{ steps.version.outputs.VERSION }}-debug
        docker push georchestra/gateway:${{ steps.version.outputs.VERSION }}
        docker push georchestra/gateway:${{ steps.version.outputs.VERSION }}-debug

    - name: "Update Gateway Docker Hub Description"
      if: github.ref == 'refs/heads/main' && github.repository == 'georchestra/gateway' && github.actor != 'dependabot[bot]' && github.event_name != 'pull_request'
      uses: peter-evans/dockerhub-description@v4
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_PASSWORD }}
        repository: georchestra/gateway
        readme-filepath: ./DOCKER_HUB.md
        short-description: 'Gateway module for the geOrchestra SDI'

    - name: Login to GitHub Container Registry
      if: github.ref == 'refs/heads/main' && github.repository == 'georchestra/gateway'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: "Push image attached to commit id to ghcr.io"
      if: github.ref == 'refs/heads/main' && github.repository == 'georchestra/gateway'
      run: |
        docker tag georchestra/gateway:latest ghcr.io/georchestra/gateway/gateway:commit-${{ github.sha }}
        docker push ghcr.io/georchestra/gateway/gateway:commit-${{ github.sha }}

    - name: "Publish binaries in artifactory"
      run: ./mvnw deploy -Dmaven.test.skip=true
      continue-on-error: true
      env:
        ARTIFACTORY_TOKEN_REF: ${{ secrets.ARTIFACTORY_TOKEN }}
        ARTIFACTORY_USERNAME_REF: ${{ secrets.ARTIFACTORY_USERNAME }}

    - name: "Remove SNAPSHOT jars from repository"
      run: |
        find .m2/repository -name "*SNAPSHOT*" -type d | xargs rm -rf {}
