name: "Test pull request"
on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: "Checking out"
      uses: actions/checkout@v4
      with:
        submodules: 'true'

    - name: "Setting up Java"
      uses: actions/setup-java@v4
      with:
        distribution: 'adopt'
        java-version: '21'
        cache: 'maven'

    # fail instead of reformatting when sources or pom.xml files are not formatted
    - name: "Build gateway"
      run: make install MVN_ARGS="-Dfmt.action=validate -Dpom.fmt.action=verify"

    - name: "Run tests"
      run: make test MVN_ARGS="-Dfmt.action=validate -Dpom.fmt.action=verify"

    - name: "Build docker image"
      run: make docker

    - name: "Remove SNAPSHOT jars from repository"
      run: |
        find .m2/repository -name "*SNAPSHOT*" -type d | xargs rm -rf {}
