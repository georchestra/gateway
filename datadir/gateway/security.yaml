---
spring.config.activate.on-profile: preauth
georchestra:
  gateway:
    security:
      createNonExistingUsersInLDAP: true
      header-authentication:
        enabled: true
      ldap:
        default:
          adminDn: cn=admin,dc=georchestra,dc=org
          adminPassword: secret
