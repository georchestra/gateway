# File included by gateway.yaml to set up the security/authentication aspects
# of the application.

georchestra:
  gateway:
    security:
      # from datadir
      moderatedSignup: ${moderatedSignup:false}
      createNonExistingUsersInLDAP: false
      # You can disable UID transformation for an IDP by its identifier
      # This lead to not prefixing or sanitize the UID from this IDP
      #disableUidTransformation: 'icu'

      #events:
      #  accountcreated:
      #    # Set this url to console's endpoint to be able to receive an email when a new user logs in
      #    #  for the first time with an IDP and is created in LDAP.
      #    url: "http://console:8080/console/internal/events/accountcreated"
      #

      # Used to enable sirene API calls to resolve organization names from SIRET codes.
      # If enabled, make sure to set the SIRENE_API_KEY env variable with a valid API key from https://portail-api.insee.fr/.
      #sirene:
      #  enabled: true
      #  api-key: ${SIRENE_API_KEY}

      oauth2:
        # if enabled, make sure to have at least one OAuth2 client
        # set up at spring.security.oauth2.client below 
        enabled: false
        proxy:
          # If the OAuht2 clients need to go through an HTTP Proxy, enable and configure.
          enabled: false
          host: localhost
          port: 8000
          username: jack
          password: insecure

      # Disable LDAP form login while keeping LDAP HTTP Basic authentication enabled.
      # Useful when LDAP must remain available for technical clients, while browser
      # users should authenticate only through OAuth2/OIDC.
      disableLdapFormLogin: false

      # Challenge anonymous clients matching any of these User-Agent regexes with
      # HTTP 401 and WWW-Authenticate: Basic, even for public services.
      # Requires HTTP Basic authentication (LDAP) to be enabled. Existing
      # authenticated sessions are accepted. Patterns match the entire header;
      # use .* for a substring match. Empty by default (disabled).
      # Example only: use the actual User-Agent sent by your client.
      # httpBasicUserAgentPatterns:
      #   - '(?i).*GeoWebCache.*'
      httpBasicUserAgentPatterns: []

      # Reuse Basic authentication through the existing session store.
      # Requires the existing LDAP HTTP Basic authentication provider.
      # A session is saved on the first successful Basic request, without probing
      # cookie support. Clients must return the session cookie to reuse it.
      # Each session is reauthenticated at the next request after the configured
      # interval, even if it has been continuously active. Reuse does not extend it.
      # Cookie-only requests at that point receive a 401 Basic challenge.
      httpBasicSession:
        enabled: false
        reauthenticationInterval: 1h

      ldap:
        # Multiple LDAP data sources are supported. The first key defines a simple
        # name for them. The `default` one here, disabled by default, is pre-configured
        # to use Georchestra's default OpenLDAP database.
        # You should usually just enable it in the georchestra datadir's gateway.yml
        # with georchestra.gateway.security.ldap.default.enabled: true
        default:
          enabled: true
        ldap2:
          # Sample additional LDAP database configuration. Disabled. Enable and
          # tweak as needed if you want to authenticate against multiple LDAP databases.
          # Can also change the 'ldap2' key to something meaningful to you.
          enabled: false
          extended: true
          url: ${ldapScheme}://${ldapHost}:${ldapPort}
          baseDn: ${ldapBaseDn:dc=georchestra,dc=org}
          users:
            rdn: ${ldapUsersRdn:ou=users}
            searchFilter: ${ldapUserSearchFilter:(uid={0})}
          roles:
            rdn: ${ldapRolesRdn:ou=roles}
            searchFilter: ${ldapRolesSearchFilter:(member={0})}
          orgs:
            rdn: ${ldapOrgsRdn:ou=orgs}
          adminDn: uid=admin,ou=georchestra,ou=org
          adminPassword: s3cr3t
        activeDirSample:
          enabled: false
          activeDirectory: true
          url: ${ldapScheme}://${ldapHost}:${ldapPort}
          baseDn: ${ldapBaseDn:dc=georchestra,dc=org}
          users:
            rdn: ${ldapUsersRdn:ou=users}
            searchFilter: ${ldapUserSearchFilter:(uid={0})}
          roles:
            rdn: ${ldapRolesRdn:ou=roles}
            searchFilter: (&(objectClass=user)(userPrincipalName={0}))
          adminDn: uid=gdi-admin,ou=myorg,ou=Applications
          adminPassword: s3cr3t

      #oidc:
      #  config:
      #    provider:
      #      icu:
      #        searchEmail: true # Determines if the user will be searched by email (false by default).
      #        moderatedSignup: true # if true, users logging in with this provider for the first time will be created in LDAP but disabled, waiting for an admin to validate them. If false, they will be created as enabled.
      #        overrideExistingOrgName: false # don't update existing orgs
      #        orgNameResolvers: # fallback chain
      #          - sirene # try to resolve org name from SIRENE API using the siret from the token: need to be configured above (enabled + token)
      #          - identifier # use the identifier from the token (e.g. "siret:12345678901234")
      #          - NO_ORG # fallback to this static short name if the previous resolvers fail. MATCH the shortname of an existing org, or it will be created as a new one with this name.
      #  # Claims mapping from the OIDC provider's token to the user details used by the gateway and downstream services.
      #  claims:
      #    provider:
      #      icu:
      #        id.path: "$.sub"
      #        email.path: "$.email"
      #        familyName.path: "$.usual_name"
      #        givenName.path: "$.given_name"
      #        organization.path: "$.siret"
      #        organizationUid.path: "$.siret"

# If georchestra.gateway.security.oauth2.enabled == true above, set up
